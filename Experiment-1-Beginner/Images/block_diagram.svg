<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">Automated Digital Circuit Tester — Block Diagram</text>

  <!-- Inputs -->
  <rect x="30" y="90" width="140" height="56" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="100" y="113" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="600">BTN0 (rst)</text>
  <text x="100" y="132" text-anchor="middle" font-size="12" fill="#444">Synchronous reset</text>

  <rect x="30" y="170" width="140" height="56" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="100" y="193" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="600">BTN1 (start)</text>
  <text x="100" y="212" text-anchor="middle" font-size="12" fill="#444">Edge-detected pulse</text>

  <rect x="30" y="250" width="140" height="56" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="100" y="273" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="600">clk (H16)</text>
  <text x="100" y="292" text-anchor="middle" font-size="12" fill="#444">125 MHz board clock</text>

  <!-- Clock divider -->
  <rect x="220" y="250" width="150" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="295" y="273" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="600">Clock Divider</text>
  <text x="295" y="292" text-anchor="middle" font-size="12" fill="#444">tick ≈ 5 Hz</text>

  <!-- FSM Controller -->
  <rect x="420" y="150" width="190" height="130" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="515" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">FSM Controller</text>
  <text x="515" y="200" text-anchor="middle" font-size="12" fill="#444">IDLE → RUN → DONE</text>
  <text x="515" y="220" text-anchor="middle" font-size="12" fill="#444">idx counter (0..7)</text>
  <text x="515" y="240" text-anchor="middle" font-size="12" fill="#444">fail_flag / fail_idx</text>
  <text x="515" y="260" text-anchor="middle" font-size="12" fill="#444">latch registers</text>

  <!-- Test ROM -->
  <rect x="420" y="40" width="190" height="80" rx="8" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="515" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a2e">Test Vector ROM</text>
  <text x="515" y="85" text-anchor="middle" font-size="12" fill="#444">8 × {a,b,op,exp_cout,</text>
  <text x="515" y="102" text-anchor="middle" font-size="12" fill="#444">exp_result} packed entries</text>

  <!-- DUT ALU -->
  <rect x="660" y="40" width="200" height="90" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="760" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">DUT: alu4</text>
  <text x="760" y="85" text-anchor="middle" font-size="12" fill="#444">4-bit ALU</text>
  <text x="760" y="103" text-anchor="middle" font-size="12" fill="#444">ADD / SUB / AND / OR</text>

  <!-- Comparator -->
  <rect x="660" y="160" width="200" height="80" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="760" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a2e">Comparator</text>
  <text x="760" y="208" text-anchor="middle" font-size="12" fill="#444">dut_result == exp_result</text>
  <text x="760" y="225" text-anchor="middle" font-size="12" fill="#444">dut_cout == exp_cout</text>

  <!-- LED Display -->
  <rect x="420" y="340" width="190" height="90" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="515" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">LED Display</text>
  <text x="515" y="385" text-anchor="middle" font-size="12" fill="#444">RUN:  [heartbeat | idx]</text>
  <text x="515" y="403" text-anchor="middle" font-size="12" fill="#444">DONE: [pass | fail_idx]</text>

  <!-- Arrows -->
  <g stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M170 118 L420 180"/>
    <path d="M170 198 L420 210"/>
    <path d="M170 278 L220 278"/>
    <path d="M370 278 L420 250"/>
    <path d="M515 150 L515 120"/>
    <path d="M610 90 L660 85"/>
    <path d="M610 210 L660 90" />
    <path d="M860 100 L860 160" />
    <path d="M660 200 L515 220"/>
    <path d="M515 280 L515 340"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <text x="450" y="460" text-anchor="middle" font-size="11" fill="#777">Team Mahasena — Lead: Manaswi — PYNQ-Z2 (XC7Z020CLG400-1)</text>
</svg>
