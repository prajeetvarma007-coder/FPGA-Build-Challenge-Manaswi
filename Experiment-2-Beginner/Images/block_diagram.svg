<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">TrustFuse — Hardware Sensor Trust — Block Diagram</text>

  <!-- Base generator -->
  <rect x="30" y="90" width="170" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="115" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a2e">Base Value Generator</text>
  <text x="115" y="138" text-anchor="middle" font-size="12" fill="#444">Triangle wave 8-bit</text>
  <text x="115" y="155" text-anchor="middle" font-size="12" fill="#444">(SW0 = freeze)</text>

  <!-- Sensors -->
  <rect x="250" y="40" width="160" height="50" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="330" y="70" text-anchor="middle" font-size="12" fill="#1a1a2e" font-weight="600">sensor1 = base</text>

  <rect x="250" y="105" width="160" height="50" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="330" y="135" text-anchor="middle" font-size="12" fill="#1a1a2e" font-weight="600">sensor2 = base+3</text>

  <rect x="250" y="170" width="160" height="50" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="330" y="200" text-anchor="middle" font-size="12" fill="#1a1a2e" font-weight="600">sensor3 = base−3</text>

  <!-- Fault injection -->
  <rect x="460" y="40" width="190" height="50" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="555" y="63" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">BTN1 fault1 → 0xFF</text>
  <text x="555" y="80" text-anchor="middle" font-size="11" fill="#444">(saturating mux)</text>

  <rect x="460" y="105" width="190" height="50" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="555" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">BTN2 fault2 → 0x00</text>
  <text x="555" y="145" text-anchor="middle" font-size="11" fill="#444">(saturating mux)</text>

  <rect x="460" y="170" width="190" height="50" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="555" y="193" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">BTN3 fault3 → +60</text>
  <text x="555" y="210" text-anchor="middle" font-size="11" fill="#444">(saturating mux)</text>

  <!-- Deviation checks -->
  <rect x="700" y="60" width="180" height="150" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="790" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Pairwise Deviation</text>
  <text x="790" y="105" text-anchor="middle" font-size="12" fill="#444">d12, d13, d23</text>
  <text x="790" y="123" text-anchor="middle" font-size="12" fill="#444">abs_diff() ≤ TOLERANCE</text>
  <text x="790" y="143" text-anchor="middle" font-size="12" fill="#444">agree12/13/23</text>
  <text x="790" y="163" text-anchor="middle" font-size="12" fill="#444">trust1/2/3 flags</text>
  <text x="790" y="183" text-anchor="middle" font-size="12" fill="#444">num_trusted (0-3)</text>

  <!-- Trust logic -->
  <rect x="460" y="280" width="220" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="570" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Trust Level + Bad-ID Logic</text>
  <text x="570" y="330" text-anchor="middle" font-size="12" fill="#444">trust_level: NONE/LOW/MED/HIGH</text>
  <text x="570" y="348" text-anchor="middle" font-size="12" fill="#444">bad_id: which sensor is outlier</text>
  <text x="570" y="366" text-anchor="middle" font-size="12" fill="#444">(single-outlier case only)</text>

  <!-- Fused value -->
  <rect x="700" y="280" width="180" height="100" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
  <text x="790" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Priority Fusion</text>
  <text x="790" y="328" text-anchor="middle" font-size="12" fill="#444">fused_value = first</text>
  <text x="790" y="346" text-anchor="middle" font-size="12" fill="#444">trusted sensor</text>
  <text x="790" y="364" text-anchor="middle" font-size="11" fill="#777">(inspect in waveform)</text>

  <!-- LED display -->
  <rect x="150" y="420" width="220" height="70" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="260" y="448" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">LED[3:0] Display</text>
  <text x="260" y="468" text-anchor="middle" font-size="12" fill="#444">[3:2]=trust level  [1:0]=bad id</text>

  <!-- Arrows -->
  <g stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrow2)">
    <path d="M200 115 L250 65"/>
    <path d="M200 130 L250 130"/>
    <path d="M200 145 L250 195"/>
    <path d="M410 65 L460 65"/>
    <path d="M410 130 L460 130"/>
    <path d="M410 195 L460 195"/>
    <path d="M650 65 L700 110"/>
    <path d="M650 130 L700 140"/>
    <path d="M650 195 L700 170"/>
    <path d="M790 210 L580 280"/>
    <path d="M790 210 L790 280"/>
    <path d="M570 380 L260 420"/>
  </g>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <text x="450" y="505" text-anchor="middle" font-size="11" fill="#777">Team Mahasena — Lead: Manaswi — PYNQ-Z2 (XC7Z020CLG400-1)</text>
</svg>
